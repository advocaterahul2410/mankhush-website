<!DOCTYPE html>
<html>
<head>
<title>Mano Shanti – Order Online</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:Arial;background:#fafafa;margin:0}
header{background:#fff;padding:15px;display:flex;justify-content:space-between}
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px;padding:20px}
.card{background:#fff;padding:10px;border-radius:10px;box-shadow:0 2px 6px rgba(0,0,0,.1)}
.card img{width:100%;height:150px;object-fit:cover;border-radius:8px}
button{background:#000;color:#fff;border:none;padding:8px 12px;border-radius:5px}
.cart{background:#fff;margin:20px;padding:15px;border-radius:10px}
.apps img{height:30px;opacity:.6}
</style>
</head>

<body>

<header>
<h2>MANO SHANTI</h2>
<div class="apps">
<img src="https://upload.wikimedia.org/wikipedia/commons/7/75/Zomato_logo.png">
<img src="https://upload.wikimedia.org/wikipedia/commons/1/13/Swiggy_logo.png">
<div style="font-size:12px">Coming Soon</div>
</div>
</header>

<div class="menu" id="menu"></div>

<div class="cart">
<h3>Cart</h3>
<div id="cartItems"></div>
<h3>Total ₹<span id="total">0</span></h3>
<button onclick="orderWhatsApp()">Order on WhatsApp</button>
</div>

<script>
const phone="91XXXXXXXXXX"; // your WhatsApp number

const items=[
{name:"Dahi Bhalla",price:200,img:"https://upload.wikimedia.org/wikipedia/commons/3/36/Dahi_Bhalla.jpg"},
{name:"Katori Chaat (min 10)",price:2000,img:"https://upload.wikimedia.org/wikipedia/commons/5/5e/Katori_chaat.jpg"},
{name:"Premium Thandai",price:150,img:"https://upload.wikimedia.org/wikipedia/commons/9/9d/Thandai.jpg"},
{name:"Desi Ghee Gujiya (1kg)",price:800,img:"https://upload.wikimedia.org/wikipedia/commons/7/73/Gujiya.jpg"}
];

let cart=[];

function render(){
const m=document.getElementById("menu");
items.forEach(i=>{
m.innerHTML+=`
<div class="card">
<img src="${i.img}">
<h4>${i.name}</h4>
₹${i.price}<br><br>
<button onclick='add(${JSON.stringify(i)})'>Add</button>
</div>`});
}

function add(i){cart.push(i);update()}

function update(){
let t=0;document.getElementById("cartItems").innerHTML="";
cart.forEach(i=>{t+=i.price;cartItems.innerHTML+=`${i.name} – ₹${i.price}<br>`});
total.innerText=t;
}

function orderWhatsApp(){
let invoice=`MANO SHANTI%0AInvoice No: MS-${Date.now()}%0A%0A`;
let total=0;
cart.forEach(i=>{invoice+=`${i.name} – ₹${i.price}%0A`;total+=i.price});
invoice+=`%0ATotal: ₹${total}%0APlease share payment confirmation.`;
window.open(`https://wa.me/${phone}?text=${invoice}`);
}

render();
</script>

</body>
</html>
