<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mankhush Homemade Delights</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<style>
body{margin:0;font-family:Poppins;background:#fff7f0;color:#333}
header{background:#8b0000;color:white;text-align:center;padding:20px}
.container{max-width:1100px;margin:auto;padding:20px}
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px}
.card{background:white;border-radius:18px;box-shadow:0 8px 20px rgba(0,0,0,.1);padding:15px}
.card img{width:100%;height:200px;object-fit:cover;border-radius:14px}
button{background:#8b0000;color:white;border:none;padding:10px 16px;border-radius:12px;cursor:pointer}
.cart{position:fixed;bottom:20px;right:20px;background:black;color:white;padding:15px 20px;border-radius:16px;font-weight:600}
footer{text-align:center;padding:20px;background:#111;color:white}
</style>
</head>
<body>

<header>
<h1>Mankhush Homemade Delights</h1>
<p>Pure Veg | Banaras Special Taste</p>
</header>

<div class="container">
<h2>Menu</h2>
<div class="menu" id="menu"></div>

<h3>Pay via UPI</h3>
<img src="upi-qr.jpg" width="250" alt="UPI QR">
<p>GPay | PhonePe | Paytm</p>

<h3>Delivery Partners</h3>
<p>Zomato – Coming Soon | Swiggy – Coming Soon</p>

<button onclick="payNow()">Pay & Place Order</button>
</div>

<div class="cart" id="cart">Cart: ₹0</div>

<footer>
<p>Order WhatsApp: 8209520964</p>
</footer>

<script>

/* ===== CONFIG ===== */
const WHATSAPP="918209520964";
const SHEET_URL="PASTE_GOOGLE_SCRIPT_URL";
const RAZORPAY_KEY="RAZORPAY_KEY_ID";

/* ===== MENU DATA ===== */

const menuItems=[
{
name:"Desi Ghee Gujiya",
price:800,
img:"https://images.unsplash.com/photo-1617191518004-6e4f6c7d4290"
},
{
name:"Premium Holi Thandai",
price:100,
img:"https://images.unsplash.com/photo-1589308078055-4c2c04b45c30"
},
{
name:"Banarasi Tea",
price:25,
img:"https://images.unsplash.com/photo-1509042239860-f550ce710b93"
},
{
name:"Special Katori Chaat (Min 10)",
price:200,
img:"https://images.unsplash.com/photo-1601050690597-df0568f70950"
},
{
name:"Dahi Bhalle",
price:175,
img:"https://images.unsplash.com/photo-1627308595229-7830a5c91f9f"
}
];

/* ===== CART ===== */
let cart=[];
let total=0;

const menuDiv=document.getElementById("menu");

menuItems.forEach((item,index)=>{
menuDiv.innerHTML+=`
<div class="card">
<img src="${item.img}?auto=format&fit=crop&w=800&q=80">
<h3>${item.name}</h3>
<p>₹${item.price}</p>
<button onclick="addToCart(${index})">Add To Cart</button>
</div>`;
});

function addToCart(i){
cart.push(menuItems[i]);
total+=menuItems[i].price;
document.getElementById("cart").innerText="Cart: ₹"+total;
}

/* ===== PAYMENT ===== */

function payNow(){

if(total<=0){alert("Add items first");return;}

var options={
key:RAZORPAY_KEY,
amount:total*100,
currency:"INR",
name:"Mankhush Homemade Delights",
handler:function(response){

/* Save Order */
fetch(SHEET_URL,{method:"POST",body:JSON.stringify({
order:cart,
amount:total,
payment:response.razorpay_payment_id
})});

/* WhatsApp Confirm */
window.open(`https://wa.me/${WHATSAPP}?text=Order Confirmed | Amount ₹${total} | Payment ID ${response.razorpay_payment_id}`);

}
};

new Razorpay(options).open();
}

</script>
</body>
</html>
