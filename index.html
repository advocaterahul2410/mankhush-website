<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MANO SHANTI Cloud Kitchen</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>

body{
font-family:Poppins;
margin:0;
background:#fff7f0;
}

header{
background:#7a1f1f;
color:white;
padding:20px;
text-align:center;
}

.menu{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:20px;
padding:20px;
}

.card{
background:white;
border-radius:14px;
box-shadow:0 5px 15px rgba(0,0,0,.1);
padding:15px;
text-align:center;
}

.card img{
width:100%;
height:200px;
object-fit:cover;
border-radius:10px;
}

button{
background:#7a1f1f;
color:white;
border:none;
padding:10px 16px;
border-radius:8px;
cursor:pointer;
margin-top:8px;
}

.cart{
position:fixed;
right:20px;
bottom:20px;
background:white;
padding:15px;
border-radius:12px;
box-shadow:0 5px 20px rgba(0,0,0,.2);
width:250px;
}

.qr{
display:block;
margin:20px auto;
width:220px;
}

.footer{
background:#222;
color:white;
text-align:center;
padding:20px;
margin-top:40px;
}

.logoSmall{
width:70px;
margin:6px;
}

</style>
</head>

<body>

<header>
<h1>MANO SHANTI CLOUD KITCHEN</h1>
<p>Pure Veg | Premium Homemade</p>
</header>

<h2 style="text-align:center">Menu</h2>

<div class="menu">

<div class="card">
<img src="https://images.unsplash.com/photo-1601050690597-df0568f70950">
<img src="gujiya.jpg" alt="Premium Desi Ghee Gujiya">
<h3>Premium Desi Ghee Gujiya</h3>
<p>₹800 / Kg</p>
<button onclick="addItem('Gujiya',800)">Add to Cart</button>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1631452180519-c014fe946bc7">
<img src="katorichaat.jpg" alt="Katori Chaat">
<h3>Katori Chaat</h3>
<p>₹200 Per Katori (Min 10)</p>
<button onclick="addItem('Katori Chaat',200)">Add</button>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1631515243349-e0cb75fb8d3a">
<img src="dahibhalle.jpg" alt="Dahi Bhalla">
<h3>Dahi Bhalla</h3>
<p>₹200 Per Plate</p>
<button onclick="addItem('Dahi Bhalla',200)">Add</button>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1612197599080-5d54cdd4c5b1">
<img src="thandai.jpg" alt="Premium Thandai">
<h3>Premium Thandai</h3>
<p>₹150 Per Glass</p>
<button onclick="addItem('Thandai',150)">Add</button>
</div>

</div>

<h2 style="text-align:center">Scan & Pay</h2>

<!-- QR FROM ROOT -->
<img src="scanner.jpg" class="qr">

<div class="cart">
<h3>Cart</h3>
<div id="cartItems"></div>
<h4>Total ₹ <span id="total">0</span></h4>

<button onclick="downloadInvoice()">Download Invoice</button>
<button onclick="sendWhatsApp()">Order WhatsApp</button>
</div>

<div class="footer">
<h3>Delivery Partners</h3>

<img class="logoSmall" src="https://upload.wikimedia.org/wikipedia/commons/7/75/Zomato_logo.png">
<p>Coming Soon</p>

<img class="logoSmall" src="https://upload.wikimedia.org/wikipedia/commons/1/13/Swiggy_logo.png">
<p>Coming Soon</p>

</div>

<script>

let cart=[];

function addItem(name,price){
cart.push({name,price});
renderCart();
}

function renderCart(){
let html="";
let total=0;

cart.forEach(i=>{
html+=i.name+" ₹"+i.price+"<br>";
total+=i.price;
});

document.getElementById("cartItems").innerHTML=html;
document.getElementById("total").innerText=total;
}

function downloadInvoice(){

const { jsPDF } = window.jspdf;
let doc=new jsPDF();

let y=20;
doc.text("MANO SHANTI INVOICE",20,y);
y+=10;

let total=0;

cart.forEach(i=>{
doc.text(i.name+" ₹"+i.price,20,y);
y+=10;
total+=i.price;
});

doc.text("TOTAL ₹"+total,20,y+10);

doc.save("ManoShantiInvoice.pdf");

}

function sendWhatsApp(){

let msg="MANO SHANTI ORDER%0A";
let total=0;

cart.forEach(i=>{
msg+=i.name+" ₹"+i.price+"%0A";
total+=i.price;
});

msg+="TOTAL ₹"+total+"%0APaid via UPI QR";

window.open("https://wa.me/918209520964?text="+msg);

}

</script>

</body>
</html>
