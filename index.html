<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manjhush Home Delights</title>
<style>
body{font-family:Arial;margin:0;background:#fff7f0}
header{background:#ff6b00;color:#fff;padding:18px;text-align:center;font-size:24px;font-weight:bold}
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px;padding:20px}
.card{background:#fff;border-radius:14px;padding:15px;box-shadow:0 3px 10px rgba(0,0,0,.1)}
.card img{width:100%;height:220px;object-fit:cover;border-radius:10px}
button{background:#ff6b00;color:#fff;border:none;padding:10px 14px;border-radius:8px;cursor:pointer;margin-top:8px}
.cart{position:fixed;right:0;top:50%;transform:translateY(-50%);background:#fff;width:300px;padding:12px;border-radius:14px 0 0 14px;box-shadow:-3px 0 12px rgba(0,0,0,.2);max-height:80vh;overflow:auto}
.toggle{position:fixed;right:0;top:50%;transform:translateY(-50%);background:#ff6b00;color:#fff;padding:10px;border-radius:10px 0 0 10px;cursor:pointer;font-weight:bold}
.qr{width:220px;display:block;margin:10px auto}
input,textarea{width:100%;padding:8px;margin-top:6px;border-radius:6px;border:1px solid #ccc}
.small{font-size:13px;color:#666}
.item{display:flex;justify-content:space-between;margin:6px 0}
</style>
</head>
<body>
<header>Mankhush Home Delights — Pure Veg Banaras Taste</header>

<div class="menu">
  <div class="card">
    <h3>Order Online</h3>
    <button disabled style="background:#ccc;cursor:not-allowed">Zomato – Coming Soon</button>
    <button disabled style="background:#ccc;cursor:not-allowed;margin-left:6px">Swiggy – Coming Soon</button>
  </div>
  <div class="card">
    <img src="gujiya.jpg">
    <h3>Desi Ghee Gujiya</h3>
    <p>₹800 / KG</p>
    <button onclick="add('Gujiya',800)">Add</button>
  </div>

  <div class="card">
    <img src="thandai.jpg">
    <h3>Premium Holi Thandai</h3>
    <p>₹100 / Glass</p>
    <button onclick="add('Thandai',100)">Add</button>
  </div>

  <div class="card">
    <img src="katorichaat.jpg">
    <h3>Special Katori Chaat</h3>
    <p>₹200 / Piece</p>
    <button onclick="add('Katori Chaat',200)">Add</button>
  </div>

  <div class="card">
    <img src="dahibhalle.jpg">
    <h3>Dahi Bhalle</h3>
    <p>₹175 / Plate</p>
    <button onclick="add('Dahi Bhalle',175)">Add</button>
  </div>
</div>

<div class="toggle" onclick="toggleCart()">🛒 Cart</div>
<div class="cart" id="cartBox" style="display:none;">
<h3>Your Cart</h3>
<div id="cart"></div>
<h4>Total ₹ <span id="total">0</span></h4>

<h4>Customer Details</h4>
<input id="name" placeholder="Full Name">
<input id="phone" placeholder="WhatsApp Number">
<textarea id="addr" placeholder="Delivery Address"></textarea>

<h4>Scan & Pay</h4>
<img src="./upiscanner.jpg" class="qr" alt="UPI QR Code">
<p class="small">After payment, click Confirm Order</p>
<button onclick="order()">Confirm Order</button>
</div>

<script>
let cart = {};
let cartVisible = false;

function add(name, price){
  if(!cart[name]){
    cart[name] = {price: price, qty: 0};
  }
  cart[name].qty += 1;
  draw();
  showCart();
}

function draw(){
  let html = '';
  let total = 0;
  for(let i in cart){
    let item = cart[i];
    let amt = item.qty * item.price;
    total += amt;
    html += `<div class="item"><span>${i} x ${item.qty}</span><span>₹${amt}</span></div>`;
  }
  if(!html) html = '<p class="small">Cart is empty</p>';
  document.getElementById('cart').innerHTML = html;
  document.getElementById('total').innerText = total;
} x ${item.qty}<span>₹${amt}</span></div>`;
  }
  document.getElementById('cart').innerHTML = html || '<p>No items</p>';
  document.getElementById('total').innerText = total;
}

function order(){
  let n = name.value.trim();
  let p = phone.value.trim();
  let a = addr.value.trim();
  if(!n||!p||!a||Object.keys(cart).length==0){
    alert('Please fill all details and add items');return;
  }
  let total = document.getElementById('total').innerText;
  let msg = `*Mankhush Home Delights*%0A%0A🧾 Invoice:%0A`;
  for(let i in cart){
    msg += `${i} x ${cart[i].qty} = ₹${cart[i].qty*cart[i].price}%0A`;
  }
  msg += `%0A💰 Total: ₹${total}%0A%0A👤 Name: ${n}%0A📞 Phone: ${p}%0A🏠 Address: ${a}%0A%0A✅ Payment Done`;
  let url = 'https://wa.me/918209520964?text=' + encodeURIComponent(msg);
  window.open(url,'_blank');
}

function toggleCart(){
  cartVisible = !cartVisible;
  document.getElementById('cartBox').style.display = cartVisible ? 'block' : 'none';
}
function showCart(){
  cartVisible = true;
  document.getElementById('cartBox').style.display = 'block';
}
  let total = document.getElementById('total').innerText;
  let msg = `*Mankhush Home Delights*%0A%0AInvoice:%0A`;
  for(let i in cart){
    msg += `${i} x ${cart[i].qty} = ₹${cart[i].qty*cart[i].price}%0A`;
  }
  msg += `%0ATotal: ₹${total}%0A%0AName: ${n}%0APhone: ${p}%0AAddress: ${a}%0A%0APayment Done ✅`;
  window.open(`https://wa.me/918209520964?text=${msg}`,'_blank');
}
</script>
</body>
</html>
